<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sample HTML5 Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }

    header, footer {
      background-color: #3b3a3a;
      color: white;
      padding: 1em;
      text-align: center;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
      gap: 1em;
    }

    nav a {
      color: rgb(27, 27, 27);
      text-decoration: none;
    }

    main {
      padding: 1.5em;
      background-color: rgb(97, 179, 94);
    }

    section, article {
      margin-bottom: 1.5em;
      padding: 1em;
      border: 2px solid #1a1919;
      background-color: #fafafa;
    }

    aside {
      background-color: #eef;
      padding: 1em;
      margin: 1.5em;
    }

    footer {
      font-size: 0.9em;
    }

    button {
      padding: 0.5em 1em;
      background-color: grey;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #58595a;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Website</h1>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>About This Page</h2>
      <p>This is a simple example of a HTML5 document structure.</p>
    </section>

    <article>
      <h2>Latest News</h2>
      <p> JAVA is the magic of WebDev.</p>
    </article>

    <button onclick="handleClick()">Click Me</button>
  </main>

  <aside>
    <h3>Related Links</h3>
    <ul>
      <li><a href="#">HTML5 Guide</a></li>
      <li><a href="#">Semantic Tags</a></li>
    </ul>
  </aside>

  <footer>
    <p>&copy; 2025 My Website. All rights reserved.</p>
  </footer>

  <!-- Link to external JavaScript file -->
  <script src="script.js"></script>

</body>
</html>
